<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Lenda do Abismo Sombrio</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    
    <div class="game-wrapper">
        <header class="game-header">
            <h1 class="game-title">A Lenda do Abismo Sombrio</h1>
            <div class="stats-panel">
                <div class="stat-box">
                    <span class="stat-label">Vida</span>
                    <div class="health-bar-container">
                        <div id="health-bar" class="health-bar-fill" style="width: 100%;"></div>
                    </div>
                    <span id="health-val" class="stat-value">100 HP</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Ouro</span>
                    <span id="gold-val" class="stat-value">25 Moedas</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Status</span>
                    <span id="status-badge" class="badge" data-state="normal">Explorando</span>
                </div>
            </div>
        </header>

        <main class="main-layout">
            <section class="adventure-container">
                <div id="story-card" class="story-card" data-location="cave-entrance">
                    <span id="location-tag" class="location-tag">Entrada do Abismo</span>
                    <p id="story-text" class="story-text">Carregando diário de bordo...</p>
                </div>

                <div class="choices-section">
                    <h3>Opções de Ação</h3>
                    <div id="choices-container" class="choices-grid"></div>
                </div>
            </section>

            <aside class="sidebar">
                <div class="panel inventory-panel">
                    <h3>Inventário</h3>
                    <ul id="inventory-list" class="inventory-list">
                        <!-- Itens renderizados dinamicamente -->
                    </ul>
                </div>

                <div class="panel log-panel">
                    <h3>Histórico de Ações</h3>
                    <div id="log-box" class="log-box"></div>
                </div>
                
                <button id="restart-btn" class="btn-restart">Reiniciar Aventura</button>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
